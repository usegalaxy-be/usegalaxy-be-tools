name: Backfill missing tool revisions

# Runs weekly before the other Saturday jobs (01:00 UTC). No `automerge`
# label, reviewed manually for now.
on:
  workflow_dispatch:
    inputs:
      chain:
        description: Start the next step when this one finishes
        type: boolean
        default: true

jobs:
  get-lockfiles:
    runs-on: ubuntu-latest
    outputs:
      lockfiles: ${{ steps.set-matrix.outputs.lockfiles }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get all lock files
        id: set-matrix
        run: |
          lockfiles=$(ls *.yaml.lock | jq -R -s -c 'split("\n")[:-1]')
          echo "lockfiles=$lockfiles" >> $GITHUB_OUTPUT

  backfill:
    needs: get-lockfiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lockfile: ${{ fromJson(needs.get-lockfiles.outputs.lockfiles) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Backfill ${{ matrix.lockfile }}
        run: python scripts/backfill_revisions.py "${MATRIX_LOCKFILE}"
        env:
          MATRIX_LOCKFILE: ${{ matrix.lockfile }}

      - name: Upload changes
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.lockfile }}
          path: ${{ matrix.lockfile }}

  create-pr:
    needs: backfill
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Install PyYAML
        run: python3 -m pip install pyyaml

      - name: Check lock files
        run: python3 scripts/check_locks.py

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Backfill missing installable tool revisions
          title: 'Backfill missing installable tool revisions'
          body: |
            This PR was automatically generated by the `backfill-revisions` workflow and merged automatically once the lock-file checks pass.
            Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          branch: backfill-revisions
          labels: |
            auto-update
            automerge
          delete-branch: true
      - name: Merge the pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --delete-branch --repo ${{ github.repository }}

  # Runs even if this step failed: a failed step merges nothing, so the next one
  # still starts from a consistent master. workflow_run only chains three levels deep.
  next:
    needs: create-pr
    if: always() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.chain)
    runs-on: ubuntu-latest
    steps:
      - name: Start fix-outdated-tools.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run fix-outdated-tools.yml --repo ${{ github.repository }} --ref master -f chain=true
