name: Updating GTN tools

on:
  workflow_dispatch:
    inputs:
      chain:
        description: Start the next step when this one finishes
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
      - name: Install dependencies
        run: pip install ephemeris
      - name: Clone GTN repository
        uses: actions/checkout@v4
        with:
          repository: galaxyproject/training-material
          path: training-material
          ref: main
      - name: Run updater script
        run: python3 scripts/gtn-tools-updater.py ${GITHUB_WORKSPACE}/training-material/ ${GITHUB_WORKSPACE}/GTN_tutorials_tools.yaml ${GITHUB_WORKSPACE}/tools_iuc.yaml.lock ${GITHUB_WORKSPACE}/section_mapping.yml
      - name: Deleting GTN repository
        run: rm -r training-material
      - name: Show differences
        run: "git diff --stat"
      - name: Check lock files
        run: python3 scripts/check_locks.py
      - name: Create Pull Request
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update GTN workflows
          title: "Automatic updating of the GTN tools"
          body: |
            This PR is automatically generated based on changes in the [Galaxy Training Network](https://github.com/galaxyproject/training-material) workflows.

            Merged automatically once the lock-file checks pass.
          labels: |
            auto-update
            automerge
          branch: gtn-update
          base: master
      - name: Merge the pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --delete-branch --repo ${{ github.repository }}

  # Runs even if this step failed: a failed step merges nothing, so the next one
  # still starts from a consistent master. workflow_run only chains three levels deep.
  next:
    needs: build
    if: always() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.chain)
    runs-on: ubuntu-latest
    steps:
      - name: Start sync_tools.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run sync_tools.yml --repo ${{ github.repository }} --ref master -f chain=true
