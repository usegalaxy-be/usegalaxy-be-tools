name: Update Trusted Tools

on:
  # Check only, scoped to files that touch the merge script/Makefile.
  # Never opens a PR (see the Create Pull Request step's if: below).
  pull_request:
    branches:
      - master
    paths:
      - scripts/process_yaml.py
      - scripts/fix-lockfile.py
      - scripts/update-tool.py
      - Makefile
      - .schema.yaml
      - tools_iuc.yaml
      - belgium-custom.yaml
      - requirements.txt
      - .github/workflows/update-trusted.yml
  workflow_dispatch:
    inputs:
      chain:
        description: Start the next step when this one finishes
        type: boolean
        default: true
  schedule:
    # First step of the weekly chain: update-trusted, gtn-updater, sync_tools,
    # backfill-revisions, fix-outdated-tools, then the install.
    - cron: "0 1 * * SAT"

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.8]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
      - name: Clone usegalaxy-eu-tools repository
        uses: actions/checkout@v4
        with:
          repository: usegalaxy-eu/usegalaxy-eu-tools
          path: usegalaxy-eu-tools
          ref: master
      - name: Update tools_iuc.yaml from tools_iuc_eu.yaml
        run: |
          python3 scripts/process_yaml.py --merge_yaml --base_file tools_iuc.yaml --tools_yaml ${GITHUB_WORKSPACE}/usegalaxy-eu-tools/tools_iuc.yaml --out_file tools_iuc.yaml
      - name: Deleting usegalaxy-eu-tools repository
        run: rm -r usegalaxy-eu-tools
      - name: Perform linting
        run: |
            # Only tools_iuc.yaml: fix-lockfile.py on belgium-custom.yaml wipes
            # its .lock (see usegalaxy-be-tools#201).
            make tools_iuc.yaml.fix -j $(nproc)
            make update_trusted -j $(nproc)
      # Schema validation runs separately from `make lint`, which also calls
      # fix-lockfile.py and would hit the #201 lock-wiping bug.
      - name: Validate tool lists against .schema.yaml
        # Blocking on pull requests, reporting only on scheduled runs so a new
        # upstream section label can never block the weekly tool update PR.
        continue-on-error: ${{ github.event_name != 'pull_request' }}
        run: |
            pykwalify -d tools_iuc.yaml -s .schema.yaml
            pykwalify -d belgium-custom.yaml -s .schema.yaml
      - name: Show differences
        run: "git diff --stat"
      - name: Check lock files
        run: python3 scripts/check_locks.py
      - name: Create Pull Request
        if: github.event_name != 'pull_request'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Update Galaxy tools
          title: "Automatic updating of the tools in tools-iuc.yaml"
          body: |
            This PR is automatically generated based on changes in the [usegalaxy.* tools](https://github.com/usegalaxy-eu/usegalaxy-eu-tools) tools
            and updates to our own tools and new tools added.
            Merged automatically once the lock-file checks pass.
          labels: |
            auto-update
            automerge
          branch: tools-update
          base: master
      - name: Merge the pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --delete-branch --repo ${{ github.repository }}

  # Runs even if this step failed: a failed step merges nothing, so the next one
  # still starts from a consistent master. workflow_run only chains three levels deep.
  next:
    needs: build
    if: always() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.chain)
    runs-on: ubuntu-latest
    steps:
      - name: Start gtn-updater.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run gtn-updater.yml --repo ${{ github.repository }} --ref master -f chain=true
