name: Clean (uninstallable) tools revisions

# Manual only for now: this is new, unreviewed against our real lock files at
# full scale (only smoke-tested against a 5-tool sample). Not scheduled until
# a run has been reviewed end to end.
on:
  workflow_dispatch:

jobs:
  get-lockfiles:
    runs-on: ubuntu-latest
    outputs:
      lockfiles: ${{ steps.set-matrix.outputs.lockfiles }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Get all lock files
        id: set-matrix
        run: |
          lockfiles=$(ls *.yaml.lock | jq -R -s -c 'split("\n")[:-1]')
          echo "lockfiles=$lockfiles" >> $GITHUB_OUTPUT

  fix-outdated:
    needs: get-lockfiles
    runs-on: ubuntu-latest
    strategy:
      matrix:
        lockfile: ${{ fromJson(needs.get-lockfiles.outputs.lockfiles) }}
      max-parallel: 3
      fail-fast: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Fix ${{ matrix.lockfile }}
        run: python scripts/fix_outdated.py "${MATRIX_LOCKFILE}"
        env:
          MATRIX_LOCKFILE: ${{ matrix.lockfile }}

      - name: Get base name
        id: basename
        run: echo "name=${LOCKFILE%.yaml.lock}" >> $GITHUB_OUTPUT
        env:
          LOCKFILE: ${{ matrix.lockfile }}

      - name: Upload changes
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.lockfile }}
          path: |
            ${{ matrix.lockfile }}
            not-installable-revisions/${{ steps.basename.outputs.name }}.not-installable-revisions.yaml
          if-no-files-found: ignore

  create-pr:
    needs: fix-outdated
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true

      - name: Check for changes
        id: check_changes
        run: |
          if [[ -n $(git status --porcelain) ]]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected in lock files"
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Create Pull Request
        id: cpr
        if: steps.check_changes.outputs.changes == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: Remove not-installable tool revisions
          title: 'Remove not-installable tool revisions'
          body: |
            This PR was automatically generated by the `fix-outdated-tools` workflow (manual run).
            Workflow run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})
          delete-branch: true
