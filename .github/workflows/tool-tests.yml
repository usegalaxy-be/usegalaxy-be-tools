name: Tool tests

on:
  # Test what the install workflow added.
  workflow_run:
    workflows: ["Install tools from the lock files (Ephemeris)"]
    types: [completed]
  workflow_dispatch:
    inputs:
      scope:
        description: "new: just installed. untested: no result yet (resumable sweep). failed: latest result failing. flaky: failed often. all: full sweep"
        type: choice
        options: [new, untested, failed, flaky, all]
        default: new
      all_revisions:
        description: "Full sweep: every installed revision, not only the latest"
        type: boolean
        default: false
      repositories:
        description: "Only these repositories, comma-separated owner/name (e.g. iuc/bedtools)"
        default: ""
      flaky_min:
        description: "flaky: failed runs out of a tool's last 10"
        default: "2"
      chunk_size:
        description: Repository revisions per test job
        default: "25"
      parallel_tests:
        description: Tests running at the same time per job
        default: "4"

# One run at a time: every run reads and rewrites the status branch.
concurrency:
  group: tool-tests
  cancel-in-progress: false

permissions:
  contents: write

env:
  GALAXY_URL: https://usegalaxy.be
  STATUS_BRANCH: tool-test-results

jobs:
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ephemeris
        run: pip install --upgrade ephemeris

      - name: Fetch the current status
        run: |
          mkdir -p plan/status
          if git fetch --depth 1 origin "$STATUS_BRANCH"; then
            git show FETCH_HEAD:tool-tests/status.json > plan/status/status.json
          fi

      - name: List installed tools
        run: get-tool-list -g "$GALAXY_URL" -o plan/installed.yaml

      - name: Pick the revisions to test
        id: plan
        run: |
          args=(--installed plan/installed.yaml --scope "${{ inputs.scope || 'new' }}"
                --repositories "${{ inputs.repositories }}" --flaky-min "${{ inputs.flaky_min || 2 }}"
                --chunk-size "${{ inputs.chunk_size || 25 }}" --out-dir plan/chunks
                --baseline-out plan/status/baseline.json)
          if [ -f plan/status/status.json ]; then args+=(--status plan/status/status.json); fi
          if [ "${{ inputs.all_revisions }}" = "true" ]; then args+=(--all-revisions); fi
          echo "chunks=$(python scripts/tool_tests_plan.py "${args[@]}")" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: plan
          path: plan/

  test:
    needs: plan
    if: needs.plan.outputs.chunks != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 2
      fail-fast: false
      matrix:
        chunk: ${{ fromJSON(needs.plan.outputs.chunks) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ephemeris
        run: pip install --upgrade ephemeris

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan

      - name: Test ${{ matrix.chunk }}
        env:
          GALAXY_API_TOKEN: ${{ secrets.SECRET_API_TOKEN_TOOL_ADMIN }}
          GALAXY_TEST_API_TOKEN: ${{ secrets.SECRET_API_TOKEN_TOOL_TESTS }}
        run: |
          # SIGINT so ephemeris still writes the report when the time runs out.
          timeout -s INT 290m shed-tools test -t "plan/chunks/${{ matrix.chunk }}.yaml" \
            -g "$GALAXY_URL" -a "$GALAXY_API_TOKEN" --test-user-api-key "$GALAXY_TEST_API_TOKEN" \
            --test-history-name "tool-tests-${{ github.run_id }}-${{ matrix.chunk }}" \
            --parallel-tests "${{ inputs.parallel_tests || 4 }}" \
            --test-json "results-${{ matrix.chunk }}.json" || echo "::warning::shed-tools test exited with $?"

      - name: Retry infrastructure failures once
        if: always()
        env:
          GALAXY_API_TOKEN: ${{ secrets.SECRET_API_TOKEN_TOOL_ADMIN }}
          GALAXY_TEST_API_TOKEN: ${{ secrets.SECRET_API_TOKEN_TOOL_TESTS }}
        run: |
          n=$(python scripts/tool_tests_retry_list.py --chunk "plan/chunks/${{ matrix.chunk }}.yaml" \
                --results "results-${{ matrix.chunk }}.json" --out retry.yaml)
          echo "Repositories to retry: $n"
          if [ "$n" -gt 0 ]; then
            sleep 120
            timeout -s INT 40m shed-tools test -t retry.yaml \
              -g "$GALAXY_URL" -a "$GALAXY_API_TOKEN" --test-user-api-key "$GALAXY_TEST_API_TOKEN" \
              --test-history-name "tool-tests-${{ github.run_id }}-${{ matrix.chunk }}-retry" \
              --parallel-tests "${{ inputs.parallel_tests || 4 }}" \
              --test-json "results-${{ matrix.chunk }}-retry.json" || echo "::warning::retry exited with $?"
          fi

      - name: Purge the test history
        if: always()
        env:
          GALAXY_TEST_API_TOKEN: ${{ secrets.SECRET_API_TOKEN_TOOL_TESTS }}
        run: python scripts/tool_tests_cleanup.py --galaxy "$GALAXY_URL" --prefix "tool-tests-${{ github.run_id }}-${{ matrix.chunk }}"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.chunk }}
          path: results-${{ matrix.chunk }}*.json
          if-no-files-found: ignore
          retention-days: 30

  report:
    needs: [plan, test]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install PyYAML
        run: pip install pyyaml

      - uses: actions/download-artifact@v4
        with:
          name: plan
          path: plan

      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: results
          merge-multiple: true

      - name: Check out the status branch
        env:
          REPO_URL: https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git
        run: |
          if git ls-remote --exit-code --heads origin "$STATUS_BRANCH"; then
            git clone -q --depth 1 --branch "$STATUS_BRANCH" "$REPO_URL" status
          else
            git init -q -b "$STATUS_BRANCH" status
            git -C status remote add origin "$REPO_URL"
          fi
          mkdir -p status/tool-tests
          if [ ! -f status/tool-tests/status.json ] && [ -f plan/status/baseline.json ]; then
            cp plan/status/baseline.json status/tool-tests/status.json
          fi

      - name: Update the status
        run: |
          mkdir -p results plan/chunks
          python scripts/tool_tests_report.py \
            --status status/tool-tests/status.json \
            --chunks-dir plan/chunks --results-dir results \
            --expected tool-tests/expected-failures.yaml \
            --installed plan/installed.yaml \
            --run-url "${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" \
            --summary "$GITHUB_STEP_SUMMARY"

      - name: Push the status
        working-directory: status
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tool-tests/status.json
          git diff --cached --quiet || git commit -q -m "Tool test status from run ${{ github.run_id }}"
          git push -q origin "HEAD:$STATUS_BRANCH"
