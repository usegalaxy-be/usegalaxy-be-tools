name: Sync Galaxy Tools

on:
  # Check only, scoped to files that touch the compare script.
  # Never opens a PR (see the Create Pull Request step's if: below).
  pull_request:
    branches:
      - master
    paths:
      - scripts/compare_tools.py
      - belgium-custom.yaml.lock
      - GTN_tutorials_tools.yaml.lock
      - tools_iuc.yaml.lock
      - requirements.txt
      - .github/workflows/sync_tools.yml
  workflow_dispatch:
    inputs:
      chain:
        description: Start the next step when this one finishes
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          #ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Python environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.8'

      - name: Install Ephemeris
        run: |
          python -m pip install --upgrade pip
          pip install ephemeris

      - name: Fetch Galaxy tools list
        run: |
          get-tool-list -g "https://usegalaxy.be" -o current_galaxy_tools.yaml
          echo "Current Galaxy tool list fetched successfully."

      - name: Show differences
        run: "git diff --stat"

      - name: Merge and compare tool lists
        run: |
          python scripts/compare_tools.py --current current_galaxy_tools.yaml --inputs belgium-custom.yaml.lock GTN_tutorials_tools.yaml.lock tools_iuc.yaml.lock

      - name: Check lock files
        run: python3 scripts/check_locks.py
      - name: Create Pull Request
        if: github.event_name != 'pull_request'
        id: cpr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "Update current_galaxy_tools.yaml with the latest tools list (installed through admin panel) from useGalaxy.be"
          title: "Automatic update of current_galaxy_tools.yaml"
          body: |
            This pull request updates `current_galaxy_tools.yaml` with the latest tools from useGalaxy.be.
            Merged automatically once the lock-file checks pass.
          labels: |
            auto-update
            automerge
          branch: tools_sync_workflow
          base: master

      - name: Merge the pull request
        if: steps.cpr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh pr merge ${{ steps.cpr.outputs.pull-request-number }} --merge --delete-branch --repo ${{ github.repository }}

  # Runs even if this step failed: a failed step merges nothing, so the next one
  # still starts from a consistent master. workflow_run only chains three levels deep.
  next:
    needs: build
    if: always() && github.event_name != 'pull_request' && (github.event_name != 'workflow_dispatch' || inputs.chain)
    runs-on: ubuntu-latest
    steps:
      - name: Start backfill-revisions.yml
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run backfill-revisions.yml --repo ${{ github.repository }} --ref master -f chain=true
