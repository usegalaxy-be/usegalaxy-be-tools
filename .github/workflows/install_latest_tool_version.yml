name: Install tools from the lock files (Ephemeris)

on:
  workflow_dispatch:
  # Human merges. Merges by the automerge workflow use GITHUB_TOKEN, which never triggers a push run.
  push:
    branches: [master]
    paths: ['*.yaml.lock']

# Queue instead of cancelling: an install stopped halfway can leave repositories stuck in "installing".
concurrency:
  group: shed-tools-install
  cancel-in-progress: false

jobs:
  check-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse lock files that would install resolver dependencies
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in sorted(glob.glob('*.yaml.lock')):
              value = yaml.safe_load(open(path)).get('install_resolver_dependencies')
              # A quoted 'false' is a truthy string to ephemeris, so require the real boolean.
              if value is not False:
                  bad.append(f"{path}: install_resolver_dependencies={value!r}")
          if bad:
              sys.exit("\n".join(bad))
          PY

  install:
    needs: check-flags
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        lock: [tools_iuc.yaml.lock, belgium-custom.yaml.lock, GTN_tutorials_tools.yaml.lock]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ephemeris
        run: pip install --upgrade ephemeris

      - name: Install ${{ matrix.lock }} on usegalaxy.be
        env:
          GALAXY_API_TOKEN: ${{ secrets.SECRET_API_TOKEN_TOOL_ADMIN }}
          GH_TOKEN: ${{ github.token }}
        run: |
          # Stop before the job limit so the other lock files still get their turn.
          set -o pipefail
          rc=0
          timeout 330m shed-tools install -t "${{ matrix.lock }}" -g https://usegalaxy.be -a "$GALAXY_API_TOKEN" --skip-install-resolver-dependencies 2>&1 | tee install.log || rc=$?
          if [ "$rc" -eq 124 ]; then
            echo "::warning::${{ matrix.lock }} not finished after 330 minutes"
            # Start another run to continue, but fail if this one made no progress.
            grep -q 'installed successfully' install.log || exit 1
            gh workflow run install_latest_tool_version.yml --repo ${{ github.repository }} --ref ${{ github.ref_name }}
            exit 0
          fi
          exit "$rc"

  # Last step of the weekly chain. When the install restarted itself to continue,
  # the continuation run starts the tests instead.
  tool-tests:
    needs: install
    if: always() && needs.install.result != 'cancelled'
    runs-on: ubuntu-latest
    steps:
      - name: Start tool-tests.yml for the newly installed revisions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          others=$(gh run list --repo ${{ github.repository }} --workflow install_latest_tool_version.yml \
                     --json databaseId,status \
                     -q '[.[] | select(.status != "completed" and .databaseId != ${{ github.run_id }})] | length')
          if [ "$others" -gt 0 ]; then
            echo "Another install run is queued or running; it starts the tool tests when it finishes."
            exit 0
          fi
          gh workflow run tool-tests.yml --repo ${{ github.repository }} --ref master -f scope=new
