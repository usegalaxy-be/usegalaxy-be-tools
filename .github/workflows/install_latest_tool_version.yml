name: Install tools from the lock files (Ephemeris)

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths: ['*.yaml.lock']
  schedule:
    - cron: '0 1 * * MON'    # weekly catch-up, 01:00 UTC

# Queue instead of cancelling: an install stopped halfway can leave repositories stuck in "installing".
concurrency:
  group: shed-tools-install
  cancel-in-progress: false

jobs:
  check-flags:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Refuse lock files that would install resolver dependencies
        run: |
          python3 - <<'PY'
          import glob, sys, yaml
          bad = []
          for path in sorted(glob.glob('*.yaml.lock')):
              value = yaml.safe_load(open(path)).get('install_resolver_dependencies')
              # A quoted 'false' is a truthy string to ephemeris, so require the real boolean.
              if value is not False:
                  bad.append(f"{path}: install_resolver_dependencies={value!r}")
          if bad:
              sys.exit("\n".join(bad))
          PY

  install:
    needs: check-flags
    runs-on: ubuntu-latest
    timeout-minutes: 350
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        lock: [tools_iuc.yaml.lock, belgium-custom.yaml.lock, GTN_tutorials_tools.yaml.lock]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Ephemeris
        run: pip install --upgrade ephemeris

      - name: Install ${{ matrix.lock }} on usegalaxy.be
        env:
          GALAXY_API_TOKEN: ${{ secrets.SECRET_API_TOKEN_TOOL_ADMIN }}
        run: |
          shed-tools install -t "${{ matrix.lock }}" -g https://usegalaxy.be -a "$GALAXY_API_TOKEN" --skip-install-resolver-dependencies
